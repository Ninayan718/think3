<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="先写三行">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>先写三行 · 思考训练</title>
<style>:root {
  --bg: #FCF9F4;
  --surface: #FFFFFF;
  --ink: #2E2A26;
  --ink-2: #8A8178;
  --line: #E9E2D7;
  --accent: #B5652F;
  --accent-2: #C0673A;
  --accent-soft: #FFF4E3;
  --danger: #C0552E;
  --ok: #4F8A5B;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(46,42,38,.05), 0 6px 20px rgba(46,42,38,.06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: #F2ECE2;
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  position: relative;
  padding-bottom: 84px;
  box-shadow: 0 0 40px rgba(46,42,38,.06);
}

/* 顶栏 */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px 12px;
  display: flex; align-items: baseline; gap: 8px;
}
.topbar h1 { font-size: 18px; font-weight: 600; margin: 0; color: var(--ink); letter-spacing: .5px; }
.topbar .sub { font-size: 12px; color: var(--ink-2); }

/* 通用容器 */
.page { padding: 18px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.card h2 { margin: 0 0 10px; font-size: 16px; }
.muted { color: var(--ink-2); font-size: 13px; }
.tag {
  display: inline-block; font-size: 12px; color: var(--accent-2);
  background: var(--accent-soft); border-radius: 999px;
  padding: 2px 10px; margin: 0 6px 6px 0;
}

/* 输入框 */
textarea, input[type=text], input[type=url], input[type=password] {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; font-family: var(--font); font-size: 15px;
  color: var(--ink); background: #fff; resize: vertical; line-height: 1.6;
}
textarea:focus, input:focus { outline: none; border-color: var(--accent); }
textarea { min-height: 84px; }
.field-label { font-size: 13px; color: var(--ink-2); margin: 12px 0 6px; display: block; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 11px; padding: 12px 16px;
  font-family: var(--font); font-size: 15px; font-weight: 600;
  cursor: pointer; width: 100%; transition: transform .05s ease, opacity .2s;
}
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--accent-soft); color: var(--accent-2); }
.btn-line { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn-sm { width: auto; padding: 8px 13px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; }

/* 底部 tab */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; max-width: 480px; margin: 0 auto;
  background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; border: none; background: none; cursor: pointer;
  padding: 9px 0 8px; font-family: var(--font); font-size: 11px;
  color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--accent); }
.tab .badge {
  position: absolute; top: 4px; right: 50%; transform: translateX(14px);
  background: var(--danger); color: #fff; font-size: 10px; line-height: 1;
  min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
}

/* 思考流程 */
.q-block { margin-bottom: 14px; }
.q-block .qn { font-size: 14px; color: var(--ink); margin-bottom: 6px; font-weight: 500; }
.q-block .qn .num { color: var(--accent); font-weight: 600; margin-right: 6px; }
.locked {
  border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 22px 16px; text-align: center; color: var(--ink-2); background: #fff;
}
.locked b { color: var(--accent-2); }
.reveal { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform: none;} }
.pitfall { background: var(--accent-soft); border-radius: 10px; padding: 12px 13px; font-size: 14px; color: #6B4321; margin-top: 10px; }
.pitfall .lbl { font-weight: 600; display: block; margin-bottom: 4px; color: var(--accent-2); }

/* 挑刺区 */
.tabs { display: flex; gap: 8px; margin: 14px 0 10px; }
.tabs .tabbtn {
  flex: 1; text-align: center; font-size: 13px; padding: 8px; border-radius: 9px;
  border: 1px solid var(--line); background: #fff; color: var(--ink-2); cursor: pointer;
}
.tabs .tabbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.critique-out { font-size: 14px; line-height: 1.75; white-space: pre-wrap; }
.critique-out .ci { display: block; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.critique-out .ci:last-child { border-bottom: none; }

/* 列表 */
.entry {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px; cursor: pointer; box-shadow: var(--shadow);
}
.entry .t { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
.entry .meta { font-size: 12px; color: var(--ink-2); }
.entry .preview { font-size: 13px; color: var(--ink-2); margin-top: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.search {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font-family: var(--font); font-size: 14px; margin-bottom: 12px;
}
.empty { text-align: center; color: var(--ink-2); padding: 40px 20px; font-size: 14px; }

/* 详情 / 回看 */
.detail-q { margin-bottom: 12px; }
.detail-q .qn { font-size: 13px; color: var(--accent-2); font-weight: 600; }
.detail-q .qa { font-size: 15px; white-space: pre-wrap; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
.stat .v { font-size: 26px; font-weight: 600; color: var(--accent); }
.stat .k { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row .k { font-size: 14px; }
.row input[type=text], .row input[type=url], .row input[type=password] { width: 60%; }
.toggle { width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; flex: 0 0 auto; }
.toggle.on { background: var(--accent); }
.toggle .dot { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
.toggle.on .dot { left: 23px; }
.notice { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.6; }
.danger-zone { margin-top: 8px; }
.link { color: var(--accent); cursor: pointer; font-size: 14px; }
.toast {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 13px; padding: 9px 16px;
  border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50;
  max-width: 80%; text-align: center;
}
.toast.show { opacity: .95; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg);} }

/* 长内容断行加固（URL、长英文串不撑破布局） */
.muted, .notice, .field-label, .detail-q .qa, .pitfall, .q-block .qn, .entry .t { overflow-wrap: anywhere; }
.tab { min-width: 0; }

/* 匹配卡片 */
.match-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.mc-head { display: flex; gap: 10px; align-items: flex-start; }
.mc-emoji { font-size: 22px; line-height: 1.2; flex: 0 0 auto; }
.mc-name { font-size: 15px; font-weight: 600; color: var(--ink); }
.mc-one { font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.5; }
.chip {
  display: inline-block; font-size: 11px; color: var(--accent-2);
  background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 0 0;
}

/* 知识库 */
.cat-label {
  font-size: 13px; font-weight: 600; color: var(--accent-2);
  margin: 16px 0 8px; letter-spacing: .5px;
}
.cat-label:first-child { margin-top: 4px; }
.kcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 15px; margin-bottom: 10px; box-shadow: var(--shadow); cursor: pointer;
}
.kcard-head { display: flex; align-items: center; gap: 10px; }
.k-emoji { font-size: 19px; flex: 0 0 auto; }
.k-name { font-size: 15px; font-weight: 600; color: var(--ink); flex: 1; }
.k-arrow { font-size: 12px; color: var(--ink-2); flex: 0 0 auto; }
.k-body { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
.k-row { font-size: 14px; color: var(--ink); margin-bottom: 10px; line-height: 1.6; }
.k-row:last-child { margin-bottom: 0; }
.k-k {
  display: inline-block; font-size: 12px; font-weight: 600; color: #fff;
  background: var(--accent); border-radius: 6px; padding: 1px 8px; margin-right: 8px; margin-bottom: 3px;
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>先写三行</h1>
    <span class="sub">匹配思维 · 练会思考</span>
  </div>
  <div id="view"></div>
</div>
<div class="tabbar" id="tabbar"></div>
<div class="toast" id="toast"></div>
<script>/* ============================================================
 * 思维方式知识库 —— 每个方法都讲清「何时用 / 怎么用 / 误区 / 例子」
 * signals：用户原话里出现这些词，就说明这个方法可能该用上（匹配器用）
 * ============================================================ */
const CATEGORIES = [
  { id: 'see', label: '看清事实' },
  { id: 'root', label: '追根问底' },
  { id: 'decide', label: '做决定' },
  { id: 'calib', label: '校准判断' },
  { id: 'view', label: '换角度看' },
  { id: 'feel', label: '情绪与需求' }
];

const METHODS = [
  /* ---------- 看清事实 ---------- */
  {
    id: 'fact',
    name: '事实与解释分开',
    emoji: '🔍',
    category: 'see',
    scene: ['daily', 'work', 'reading'],
    oneLiner: '把「发生了什么」和「我怎么理解它」分两栏写，滤镜就掉了。',
    when: '当你对一件事有强烈感受，或脑子里一堆「他肯定……」「应该……」的时候。',
    how: '拿一张纸分两栏：左栏只写别人也能看见、能验证的事实（时间、动作、原话）；右栏写你加进去的解释、猜测、评价。先别急着评判，把两者分开本身就是厘清的第一步。',
    pitfall: '我们几乎总是把「我觉得他在针对我」当成事实记下来。混在一起，后面的所有推理都建立在想象上。',
    example: '事实「会上他打断我两次」／解释「他不认可我」／情绪「有点恼」。分完栏，落点从生闷气变成「去确认一下」。',
    questions: [
      '实际发生了什么？只写别人也能看见、能验证的部分。',
      '我对它加了什么解释、猜测或评价？',
      '去掉解释后还剩什么？我此刻的情绪叫什么？'
    ],
    signals: ['觉得', '应该', '是不是', '对不对', '以为', '针对我', '不爽', '烦', '感觉', '肯定']
  },
  {
    id: 'first',
    name: '第一性原理',
    emoji: '🧱',
    category: 'see',
    scene: ['work', 'reading', 'daily'],
    oneLiner: '别急着类比和抄答案，拆到不可再分的基本事实，从底层重新拼。',
    when: '当你问「这到底是怎么回事」「本质是什么」，或别人都在抄一种做法你却想不通为什么时。',
    how: '连续追问「为什么一定是这样？」直到触到那条无法再拆、也无需证明的基本事实或常识。然后从这条地基往上，自己重新推导一遍，而不是沿用别人给的结论。',
    pitfall: '把「大家都这么做」当成理由。第一性原理要的是底层依据，不是共识。',
    example: '「要不要做付费社群？」拆到底：用户付费的本质是「为确定性结果买单」。那我提供的是确定性吗？没有就别抄别人的玩法。',
    questions: [
      '这件事最底层、不用证明的那个事实是什么？',
      '现在大家的做法，是从这个事实推出来的吗？还是只是习惯？',
      '如果抛开所有「别人都这样」，我自己会怎么从头设计？'
    ],
    signals: ['本质', '到底', '根本', '底层', '究竟', '想不明白', '说不清本质', '底层逻辑']
  },
  {
    id: 'causal',
    name: '相关不是因果',
    emoji: '🔗',
    category: 'see',
    scene: ['work', 'reading'],
    oneLiner: '两件事同时发生，不代表一个导致了另一个。先找第三变量。',
    when: '当你说「因为 A 所以 B」「是不是 X 导致了 Y」，或看到一份「数据证明」的图表时。',
    how: '问三个问题：A 和 B 真的同时变吗？有没有可能是同一个原因同时造成了两者（第三变量）？有没有可能是巧合或时间先后造成的错觉？结论写成「相关」而非「导致」。',
    pitfall: '把时间先后当因果：「我吃完药就好了，所以药有用」——可能只是病自己好了。',
    example: '「冰淇淋销量上升，溺水也上升」——不是冰淇淋害人，是夏天到了（第三变量）。',
    questions: [
      '我说的「导致」，证据是两件事一起发生，还是真排除了别的原因？',
      '有没有一个「第三变量」同时造成了这两件事？',
      '如果只对 A 动手，B 真的会变吗？我怎么验证？'
    ],
    signals: ['因为', '所以', '导致', '影响了', '关系', '关联', '都怪', '怪']
  },

  /* ---------- 追根问底 ---------- */
  {
    id: 'why',
    name: '连问三次为什么',
    emoji: '❓',
    category: 'root',
    scene: ['work', 'daily'],
    oneLiner: '一层层往下刨，落点必须是一个今天能动手改的具体动作。',
    when: '当你说「为什么总是……」「搞不懂问题出在哪」，或事情反复出问题时。',
    how: '对一个现象连问三次「为什么」。每一层的答案不能简单重复上一层（换个角度）。追到第三层，逼自己说出「哪一层是我今天能动手改的」。',
    pitfall: '停在「因为人性」「因为大环境」这种不可操作层。追因的终点必须是个动作，否则只是抱怨。',
    example: '「报告晚了」→「数据没齐」→「没人知道要找谁要」→ 可改的一层：先列一张数据负责人清单。',
    questions: [
      '为什么会这样？写第一层原因。',
      '再问一次为什么（不要重复上一层的说法）。',
      '第三次为什么。哪一层是我今天能动手改的？'
    ],
    signals: ['为什么', '搞不懂', '问题出在哪', '总是', '老是', '到底为什么', '出问题', '反复']
  },
  {
    id: 'split',
    name: '拆成三个小问题',
    emoji: '🧩',
    category: 'root',
    scene: ['work', 'daily'],
    oneLiner: '焦虑常来自把几个问题打包成一个「大事」。拆开就不可怕了。',
    when: '当你觉得「这事好乱、太大、无从下手」，或脑子里一团麻的时候。',
    how: '把这件「好大好乱」的事，硬拆成 3 个能各自独立回答的小问题。再判断：哪一个是今天就能有答案的？剩下两个各自卡在哪？通常只有一个真紧急。',
    pitfall: '拆开之后通常只有一个真的紧急，另外两个只是跟着一起吓人。别被打包的恐惧带跑。',
    example: '「项目要黄了」→ 拆成：钱够不够／人够不够／对方还要不要。可能只有第三个是真问题。',
    questions: [
      '把这件「好大好乱」的事，拆成 3 个能独立回答的小问题。',
      '哪一个小问题今天就能有答案？答案是什么？',
      '剩下两个，各自具体卡在哪？'
    ],
    signals: ['好乱', '一团', '太大', '太多', '不知道从哪', '无从下手', '复杂', '乱']
  },
  {
    id: 'boundary',
    name: '找边界条件',
    emoji: '📏',
    category: 'root',
    scene: ['reading', 'work'],
    oneLiner: '「有道理」和「适合我」是两件事。先问它在什么条件下不成立。',
    when: '当你看到一句漂亮话想照搬，或问「这招适不适合我用」「别人行我也行吗」时。',
    how: '对任何结论问：它在什么条件下成立？举一个明确不成立的具体反例。再对照自己：我现在的情况更接近哪一边？凭什么这么判断？',
    pitfall: '看到一句漂亮话就默认普适，是读完就忘、或照搬踩坑的主要原因。',
    example: '「快速试错」适用于改得动、代价低的产品；对不可逆的资金决策就不成立。',
    questions: [
      '这个说法在什么条件下成立？',
      '在什么条件下明显不成立？举一个具体反例。',
      '我现在的情况更接近哪一边？凭什么这么判断？'
    ],
    signals: ['适不适合', '适用', '都这样', '普遍', '通用', '照搬', '别人行', '能不能用', '适合我']
  },

  /* ---------- 做决定 ---------- */
  {
    id: 'decision',
    name: '最坏结果与可逆性',
    emoji: '⚖️',
    category: 'decide',
    scene: ['work', 'daily'],
    oneLiner: '把「什么都不做」也当成一个选项一起比，很多纠结就散了。',
    when: '当你纠结「要不要」「该不该」「选哪个」，在两个选项间犹豫时。',
    how: '列出你纠结的 2-3 个选项。对每个问：最坏会怎样？我扛得住吗？这个决定可逆吗？最后务必把「什么都不做」也写成一个选项，评估它三个月后的代价。',
    pitfall: '多数纠结不是怕选错，是没把「不动」当成一个有代价的选项来评估。',
    example: '「要不要换工作」→ 不动的代价也要写：三个月后大概率还是同样的困扰。',
    questions: [
      '我在纠结的到底是哪两个（或三个）选项？',
      '每个选项最坏会怎样？我扛得住吗？这个决定可逆吗？',

/* ============================================================
 * 匹配器：用户输入一句话，挑出最该用的 2-3 个思维方式
 * 返回 [{ method, hits:[命中的信号词] }]，按命中数排序
 * ============================================================ */
function matchMethods(text) {
  const t = (text || '').toLowerCase();
  const scored = [];
  METHODS.forEach(m => {
    const hits = [];
    (m.signals || []).forEach(s => {
      if (t.indexOf(s.toLowerCase()) >= 0) hits.push(s);
    });
    if (hits.length) scored.push({ method: m, hits: hits });
  });
  scored.sort((a, b) => b.hits.length - a.hits.length);
  let top = scored.slice(0, 3);
  if (!top.length) {
    // 没命中任何信号：给一组通用打底方法，并标注「建议」
    return {
      default: true,
      list: ['fact', 'counter', 'why'].map(id => ({ method: METHODS.find(x => x.id === id), hits: [] }))
    };
  }
  return { default: false, list: top };
}

      if (!s.settings) s.settings = {};
      if (!s.entries) s.entries = [];
      s.draft = null;
      return s;
    }
  } catch (e) {}
  return {
    entries: [],

    draft: null
  };
}
function save() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(state));

/* ---------- 工具 ---------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function isToday(ts) {
  const d = new Date(ts), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1900);
}
function pickMethod(scene) {
  let pool = METHODS;
  if (scene) pool = METHODS.filter(c => c.scene.indexOf(scene) >= 0);
  if (!pool.length) pool = METHODS;
  const last = state.draft ? state.draft.methodId : null;
  let c = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && c.id === last) c = pool[(pool.indexOf(c) + 1) % pool.length];
  return c;
}
function methodById(id) { return METHODS.find(m => m.id === id); }

/* ---------- 路由 ---------- */
let curTab = 'today';
function parseHash() {
  const h = (location.hash || '').replace('#', '');
  if (['today', 'library', 'review', 'me', 'knowledge'].indexOf(h) >= 0) curTab = h;
}
function go(tab) {
  curTab = tab;
  history.replaceState(null, '', '#' + tab);
  render();
}
window.addEventListener('hashchange', () => { parseHash(); render(); });

/* ---------- 渲染分发 ---------- */
function render() {
  const v = document.getElementById('view');
  if (curTab === 'today') v.innerHTML = renderToday();
  else if (curTab === 'library') v.innerHTML = renderLibrary();
  else if (curTab === 'review') v.innerHTML = renderReview();
  else if (curTab === 'knowledge') v.innerHTML = renderKnowledge();
  else v.innerHTML = renderMe();
  renderTabbar();
  bind();
}

/* ---------- 顶栏进度（今日） ---------- */
function progressCard() {
  const todayCount = state.entries.filter(e => isToday(e.createdAt)).length;
  const due = state.entries.filter(e => !e.review && e.reviewAt <= Date.now()).length;
  return '<div class="card" style="margin-bottom:14px">' +
    '<div class="stat-grid">' +
    '<div class="stat"><div class="v">' + todayCount + '</div><div class="k">今日思考</div></div>' +

      '<div class="muted" style="margin-bottom:12px">' +
      (res.default ? '没匹配到明显信号，先用这组「打底三件套」练手：先分清事实、再找反证、最后追根因。' : '根据你说的「' + esc(topic) + '」，这几个方式最该用上。点一个，照它的步骤想想。') +

    res.list.forEach(it => {

    h += '<div class="card">' +

    m.questions.forEach((q, i) => {

function sceneChips(sel) {

function localCritiqueHTML(d) {
  const t = d.answers.filter(a => a && a.trim()).join('\n');

    return '<span class="ci">三行都写得挺具体，没抓到明显漏洞。再逼自己一句：<b>如果事实证明我错了，最可能错在哪一步？</b></span>';

/* ---------- 我的 / 设置 ---------- */
function renderMe() {
  const s = state.settings;
  const total = state.entries.length;
  const covered = new Set(state.entries.map(e => e.methodId)).size;
  const reviewed = state.entries.filter(e => e.review);
  const hit = reviewed.filter(e => e.review.verdict === 'hit').length;
  const miss = reviewed.filter(e => e.review.verdict === 'miss').length;
  const rate = (hit + miss) ? Math.round(hit / (hit + miss) * 100) : null;
  const missByMethod = {};
  state.entries.forEach(e => { if (e.review && e.review.verdict === 'miss') missByMethod[e.methodId] = (missByMethod[e.methodId] || 0) + 1; });
  const top = Object.keys(missByMethod).map(id => ({ t: (methodById(id) || {}).name, n: missByMethod[id] }))
    .sort((a, b) => b.n - a.n).slice(0, 3);

  let h = '<div class="page" style="padding:18px">';
  h += '<div class="card"><h2>你的数据</h2><div class="stat-grid">' +
    '<div class="stat"><div class="v">' + total + '</div><div class="k">思考次数</div></div>' +
    '<div class="stat"><div class="v">' + covered + '</div><div class="k">用过的思考方式</div></div>' +
    '<div class="stat"><div class="v">' + reviewed.length + '</div><div class="k">已回看</div></div>' +
    '<div class="stat"><div class="v">' + (rate == null ? '—' : rate + '%') + '</div><div class="k">判断印证率</div></div>' +
    '</div>';
  if (top.length) {
    h += '<div class="muted" style="margin-top:12px">最常打脸的方式：' + top.map(x => esc(x.t) + '×' + x.n).join('、') + '</div>';
  }
  h += '</div>';

  h += '<div class="card"><h2>设置</h2>';
  h += '<div class="row"><span class="k">回看间隔</span><select data-set="reviewDays" style="border:1px solid var(--line);border-radius:8px;padding:7px;font-family:var(--font)">' +
    [3, 7, 14].map(d => '<option value="' + d + '"' + (s.reviewDays == d ? ' selected' : '') + '>' + d + ' 天</option>').join('') + '</select></div>';
  h += '<div class="row"><span class="k">开启 AI 挑刺</span><div class="toggle ' + (s.enableAI ? 'on' : '') + '" data-toggle="enableAI"><div class="dot"></div></div></div>';
  h += '<div class="field-label">API 地址（OpenAI 兼容，如 DeepSeek：https://api.deepseek.com/v1）</div>' +
    '<input type="text" data-set="apiBase" value="' + esc(s.apiBase) + '">';
  h += '<div class="field-label">模型名</div><input type="text" data-set="model" value="' + esc(s.model) + '">';
  h += '<div class="field-label">API Key（只存在你本机浏览器里）</div><input type="password" data-set="apiKey" value="' + esc(s.apiKey) + '">';
  h += '<div class="notice">⚠️ Key 明文存在此设备 localStorage，别在公共电脑用；它只发往你填的服务，不会经过任何第三方。不想填就用「复制指令」。</div>';
  h += '<div class="btn-row"><button class="btn btn-primary" data-act="saveSettings">保存设置</button></div>';
  h += '</div>';

  h += '<div class="card"><h2>数据</h2>' +
    '<div class="btn-row">' +
    '<button class="btn btn-line btn-sm" data-act="export">导出 JSON</button>' +
    '<button class="btn btn-line btn-sm" data-act="import">导入 JSON</button>' +
    '</div>' +
    '<div class="danger-zone"><span class="link" data-act="clearData">清空所有数据</span></div>' +
    '</div>';
  h += '<div class="muted" style="text-align:center;margin-top:8px">数据只存在你这台设备。删了 App / 清缓存就找不回，记得偶尔导出。</div>';
  h += '<input type="file" id="imp" accept="application/json" style="display:none">';

}

/* ---------- 事件绑定 ---------- */
function bind() {
  const v = document.getElementById('view');
  v.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => act(el.getAttribute('data-act'), el));
  });
  document.getElementById('tabbar').querySelectorAll('[data-act="go"]').forEach(el => {
    el.addEventListener('click', () => go(el.getAttribute('data-tab')));
  });
  v.querySelectorAll('[data-a]').forEach(el => {
    el.addEventListener('input', () => { state.draft.answers[+el.getAttribute('data-a')] = el.value; });
  });
  const topic = v.querySelector('[data-topic]');
  if (topic) topic.addEventListener('input', () => { if (state.draft) state.draft.topic = topic.value; else { state.draft = { topic: topic.value, scene: '', methodId: null, answers: ['', '', ''], step: 'input' }; } });
  const topic2 = v.querySelector('[data-topic2]');
  if (topic2) topic2.addEventListener('input', () => { if (state.draft) state.draft.topic = topic2.value; });
  v.querySelectorAll('[data-scene]').forEach(el => {
    el.addEventListener('click', () => { const sc = el.getAttribute('data-scene'); if (state.draft) state.draft.scene = sc; else state.draft = { topic: '', scene: sc, methodId: null, answers: ['', '', ''], step: 'input' }; render(); });
  });
  const search = v.querySelector('[data-search]');
  if (search) search.addEventListener('input', () => { state._q = search.value; const list = document.getElementById('libList'); if (list) list.outerHTML = libListInner(search.value); bind(); });
  v.querySelectorAll('[data-ctab]').forEach(el => {
    el.addEventListener('click', () => switchCritTab(el.getAttribute('data-ctab')));
  });
  v.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => { const k = el.getAttribute('data-toggle'); state.settings[k] = !state.settings[k]; render(); });
  });
  const set = v.querySelector('[data-set="reviewDays"]');
  if (set) set.addEventListener('change', () => { state.settings.reviewDays = +set.value; });
  ['apiBase', 'model', 'apiKey'].forEach(k => {
    const el = v.querySelector('[data-set="' + k + '"]');
    if (el) el.addEventListener('input', () => { state.settings[k] = el.value; });
  });
  const imp = document.getElementById('imp');
  if (imp) imp.addEventListener('change', importFile);
}

function libListInner(q) {
  q = (q || '').toLowerCase();
  const list = state.entries.slice().sort((a, b) => b.createdAt - a.createdAt).filter(e => {
    if (!q) return true;
    return (e.topic + ' ' + e.answers.map(a => a.a).join(' ') + ' ' + e.methodTitle).toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) return '<div class="empty">没找到匹配的。</div>';
  return list.map(e => '<div class="entry" data-act="open" data-id="' + e.id + '">' +
    '<div class="t">' + esc(e.topic || '(未填主题)') + '</div>' +
    '<div class="meta">' + fmtDate(e.createdAt) + ' · ' + esc(e.methodTitle) +
    (e.review ? ' · 已回看' : (e.reviewAt <= Date.now() ? ' · <span style="color:var(--danger)">该回看了</span>' : '')) + '</div>' +
    '<div class="preview">' + esc(e.answers.map(a => a.a).join(' ')) + '</div></div>').join('');
}

/* ---------- 行为分发 ---------- */
function act(a, el) {
  switch (a) {
    case 'match': {
      const topic = (document.querySelector('[data-topic]') || {}).value || (state.draft ? state.draft.topic : '');
      if (topic.trim().length < 4) { toast('先写一句话，至少 4 个字'); return; }
      const scene = state.draft ? state.draft.scene : '';
      state.draft = { topic: topic, scene: scene, methodId: null, answers: ['', '', ''], step: 'match' };
      render();
      break;
    }
    case 'backinput': {
      if (state.draft) state.draft.step = 'input';
      render();
      break;
    }
    case 'usemethod': {
      const id = el.getAttribute('data-id');
      const d = state.draft || { topic: '', scene: '' };
      state.draft = { topic: d.topic || '', scene: d.scene || '', methodId: id, answers: ['', '', ''], step: 'write' };
      render();
      break;
    }
    case 'random': {
      const scene = state.draft ? state.draft.scene : '';
      const m = pickMethod(scene);
      const d = state.draft || { topic: '', scene: scene };
      state.draft = { topic: d.topic || '', scene: scene, methodId: m.id, answers: ['', '', ''], step: 'write' };
      render();
      break;
    }
    case 'redraw': {
      const d = state.draft; if (!d) return;
      // 回到匹配（若有主题）或随机
      if (d.topic && d.topic.trim().length >= 4) { d.step = 'match'; d.methodId = null; render(); }
      else { const m = pickMethod(d.scene); state.draft = { topic: d.topic || '', scene: d.scene || '', methodId: m.id, answers: ['', '', ''], step: 'write' }; render(); }
      break;
    }
    case 'unlock': {
      const d = state.draft;
      if (d.answers.filter(x => (x || '').trim().length >= 4).length < 3) { toast('三行都至少写 4 个字才能解锁'); return; }
      d.step = 'reveal'; save(); render();
      break;
    }
    case 'save': {
      const d = state.draft; if (!d) return;
      const m = methodById(d.methodId);
      const topicFinal = (d.topic && d.topic.trim()) ? d.topic.trim() : (d.answers.find(x => x && x.trim()) || '');
      const entry = {
        id: uid(), createdAt: Date.now(), topic: topicFinal, methodId: m.id, methodTitle: m.name,
        answers: m.questions.map((q, i) => ({ q: q, a: d.answers[i] || '' })),
        tags: m.scene.slice(), reviewAt: Date.now() + state.settings.reviewDays * 86400000,
        review: null, critique: d.critique || null, critType: d.critType || null
      };
      state.entries.push(entry); state.draft = null; save();
      toast('已存进思考库，' + state.settings.reviewDays + ' 天后回来回看');
      go('today');
      break;
    }
    case 'open': showDetail(el.getAttribute('data-id'), 'view'); break;
    case 'revopen': showDetail(el.getAttribute('data-id'), 'review'); break;
    case 'back': go(curTab === 'review' ? 'review' : 'library'); break;
    case 'knowtoggle': {
      const id = el.getAttribute('data-id');
      openKnow[id] = !openKnow[id];
      renderKnowledgeInto();
      break;
    }
    case 'knowuse': {
      const id = el.getAttribute('data-id');
      state.draft = { topic: '', scene: '', methodId: id, answers: ['', '', ''], step: 'write' };
      go('today');
      break;
    }
    case 'revsave': {
      const id = el.getAttribute('data-id'); const v = el.getAttribute('data-v');
      const e = state.entries.find(x => x.id === id); if (!e) return;
      const noteEl = document.querySelector('[data-revnote]');
      e.review = { at: Date.now(), verdict: v, note: noteEl ? noteEl.value.trim() : '' };
      save(); toast('已记录回看'); renderReview(); renderTabbar();
      curTab = 'review';
      break;
    }
    case 'crit-copy': {
      const text = buildPrompt(state.draft);
      copyText(text);
      break;
    }
    case 'crit-ai': doAICritique(); break;
    case 'export': doExport(); break;
    case 'import': document.getElementById('imp').click(); break;
    case 'clearData': doClear(); break;
    case 'saveSettings': save(); toast('设置已保存'); render(); break;
  }
}

function renderKnowledgeInto() {
  const v = document.getElementById('view');
  const html = renderKnowledge();
  // 只替换内容，避免重绑出错；直接 innerHTML 后重绑
  v.innerHTML = html;
  bind();
}

function showDetail(id, mode) {
  const e = state.entries.find(x => x.id === id); if (!e) return;
  curTab = mode === 'review' ? 'review' : 'library';
  document.getElementById('view').innerHTML = detailHTML(e, mode);
  renderTabbar(); bind();
}

/* ---------- 挑刺 tab 切换 ---------- */
function switchCritTab(tab) {
  document.querySelectorAll('[data-ctab]').forEach(el => el.classList.toggle('on', el.getAttribute('data-ctab') === tab));
  const out = document.getElementById('critOut');
  if (tab === 'local') out.innerHTML = localCritiqueHTML(state.draft);
  else if (tab === 'copy') out.innerHTML = '<span class="ci">点下方按钮，把挑刺指令和你的三行一起复制到剪贴板，粘到任意 AI 即可。</span><div class="btn-row"><button class="btn btn-ghost" data-act="crit-copy">复制挑刺指令</button></div>';
  else if (tab === 'ai') {
    if (!state.settings.enableAI || !state.settings.apiKey) { out.innerHTML = '<span class="ci">还没配置 API，先去「我的」开启。</span>'; return; }
    out.innerHTML = '<span class="ci">点下方按钮，用你自己的 API 直接挑刺（只挑刺，不给答案）。</span><div class="btn-row"><button class="btn btn-primary" data-act="crit-ai">请求 AI 挑刺</button></div>';
  }
  bind();
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('已复制，去任意 AI 粘上')).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，请手动选取'); }
  document.body.removeChild(ta);
}

/* ---------- AI 挑刺 ---------- */
async function doAICritique() {
  const d = state.draft; if (!d) return;
  if (!state.settings.enableAI || !state.settings.apiKey) { toast('请先在「我的」配置 API'); return; }
  const userPrompt = buildPrompt(d);
  const btn = document.querySelector('[data-act="crit-ai"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 请求中'; }
  try {
    const base = state.settings.apiBase.replace(/\/+$/, '');
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.settings.apiKey },
      body: JSON.stringify({
        model: state.settings.model || 'gpt-4o-mini',
        temperature: 0.6,
        messages: [
          { role: 'system', content: CRITIQUE_SYSTEM },
          { role: 'user', content: userPrompt }
        ]
      })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const txt = (data.choices && data.choices[0] && data.choices[0].message.content) || '';
    const out = document.getElementById('critOut');
    d.critique = txt; d.critType = 'ai';
    out.innerHTML = txt.split('\n').filter(x => x.trim()).map(x => '<span class="ci">' + esc(x) + '</span>').join('');
    save();
    if (btn) { btn.disabled = false; btn.textContent = '重新请求'; }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '请求 AI 挑刺'; }
    toast('请求失败：' + e.message + '（可改用复制指令）');
  }
}

/* ---------- 导出 / 导入 / 清空 ---------- */
function doExport() {
  const blob = new Blob([JSON.stringify(state.entries, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'think3-export-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importFile(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const arr = JSON.parse(r.result);
      let added = 0;
      arr.forEach(e => { if (e && e.id && !state.entries.some(x => x.id === e.id)) { state.entries.push(e); added++; } });
      save(); toast('导入 ' + added + ' 条'); render();
    } catch (err) { toast('解析失败，文件格式不对'); }
  };
  r.readAsText(f);
}
function doClear() {
  if (confirm('确定清空全部思考记录？此操作不可恢复，建议先导出。')) {
    state.entries = []; state.draft = null; save(); toast('已清空'); go('today');
  }
}

/* ---------- 启动 ---------- */
function seedDemo() {
  const m = methodById('fact');
  state.draft = {
    topic: '同事改了我方案没打招呼，我很烦', scene: 'work', methodId: m.id,
    answers: ['会上他打断我两次', '他肯定是不认可我', '所以我干脆也别管细节了'],
    step: 'reveal', critique: null, critType: null
  };
  curTab = 'today';
}
parseHash();
if (location.hash === '#demo') seedDemo();
render();
</script>
